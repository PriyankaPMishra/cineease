info:
  app:
    name: User Service
    description: User management service for Cineease


spring:
  application:
    name: user-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/cineease}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

    show-sql: true

    properties:
      hibernate:
        format_sql: true


server:
  port: 8085


jwt:
  secret: ${JWT_SECRET}
  expiration: 1800


management:
  info:
    env:
      enabled: true

  endpoints:
    web:
      exposure:
        include: health,info